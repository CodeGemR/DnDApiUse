<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dnd API</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <div class="monsterContainer">
        <input type="text" list="monsters" id="monsterInput" placeholder="Search for DND monsters">
        <div id="monsters" class="dropDown">
            
        </div>
        <button id="searchButton">Search</button>
        <div id="monsterResult" class="monster-Result"></div>
    </div>

    <div class="rulesContainer">
        <input type="text" id="ruleInput" placeholder="Search for DND Rules">
        <div id="rules" class="dropDown">
            
        </div>
        <button id="searchRuleButton">Search</button>
        <div id="ruleResult" class="rule-Result"></div>
    </div>
</body>
</html>
